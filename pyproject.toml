[project]
name = "rca-agent"
version = "0.0.0"
description = "Offline RCA agent contract and evaluation harness"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
eval = ["RCAEval==1.7.0"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["contract: contract validation", "security: isolation and leakage checks"]

[tool.ruff]
target-version = "py312"
line-length = 100
